version: "3.8"

services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: letsencrypt-companion
    environment:
      - DEFAULT_EMAIL=your-email@domain.com
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  customerportalapi:
    image: codehop/beemaedge-backend:beemaedge-backend
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    environment:
      - ASPNETCORE_API_USER_SECRETS_ID=28040e26-cf45-47bd-958d-a99d40dfb352
      - ASPNETCORE_ENVIRONMENT=Dev
      - Seq__ServerUrl=http://seq:5341
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:5341
    volumes:
      - /root/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
    depends_on:
      - seq
    restart: always

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"     # Web UI
      - "5342:5341"   # Ingest API (optional if only using web UI)
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=S3cur3d@1990
    volumes:
      - seq-data:/data
    restart: always

volumes:
  seq-data:
