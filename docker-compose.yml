version: "3.9"

services:
  # ----------------- NGINX PROXY -----------------
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    networks:
      - proxy

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: letsencrypt-companion
    restart: always
    environment:
      DEFAULT_EMAIL: "your-email@domain.com"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    networks:
      - proxy
    depends_on:
      - nginx-proxy

  # ----------------- POSTGRES -----------------
  postgres:
    image: postgres:15
    container_name: beemapg
    restart: always
    environment:
      POSTGRES_USER: beemauser
      POSTGRES_PASSWORD: beemapass
      POSTGRES_DB: beemadb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  # ----------------- CUSTOMER PORTAL API -----------------
  customerportalapi:
    container_name: customerportalapi
    restart: always
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Dev"
      Seq__ServerUrl: "http://seq:80"
      Serilog__WriteTo__0__Name: "Seq"
      Serilog__WriteTo__0__Args__serverUrl: "http://seq:80"

      # Required for nginx-proxy + SSL
      VIRTUAL_HOST: api.localtest.me   # Use localtest.me as dummy hostname
      LETSENCRYPT_HOST: api.localtest.me
      LETSENCRYPT_EMAIL: your-email@domain.com

      # PostgreSQL connection string
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=beemadb;Username=beemauser;Password=beemapass;Pooling=true;"
    expose:
      - "8080"
    volumes:
      - /root/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
    depends_on:
      - postgres
      - seq
    networks:
      - proxy
      - internal

  # ----------------- SEQ -----------------
  seq:
    container_name: seq
    image: datalust/seq:latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "S3cur3d@1990"
    ports:
      - "5341:80"    # UI
      - "5342:5341"  # Ingest
    volumes:
      - seq-data:/data
    networks:
      - internal

# ----------------- VOLUMES -----------------
volumes:
  seq-data:
  pgdata:

# ----------------- NETWORKS -----------------
networks:
  proxy:
  internal:
